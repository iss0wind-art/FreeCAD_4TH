<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>코란도 스포츠 캠핑 시스템 3D v3</title>
<style>
body { margin:0; overflow:hidden; background:#2a2a2a; color:#fff; font-family:'Malgun Gothic',sans-serif; }
#info { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.8); padding:12px 24px; border-radius:8px; font-size:14px; z-index:10; }
#controls { position:absolute; bottom:80px; left:50%; transform:translateX(-50%); z-index:10; display:flex; gap:10px; }
button { padding:10px 30px; border:none; border-radius:6px; cursor:pointer; font-size:15px; font-weight:bold; }
.btn1 { background:#666; color:#fff; }
.btn2 { background:#e67e22; color:#fff; }
.btn3 { background:#3498db; color:#fff; }
.btn4 { background:#2ecc71; color:#fff; }
button:hover { opacity:.85; }
#progress-bar { position:absolute; top:0; left:0; height:3px; background:#e67e22; z-index:20; transition:width .05s; }
</style>
</head>
<body>
<div id="progress-bar"></div>
<div id="controls">
  <button class="btn1" onclick="setMode(0)">기본</button>
  <button class="btn4" onclick="setMode(0.5)">침대</button>
  <button class="btn2" onclick="setMode(1)">캠핑</button>
  <button class="btn3" onclick="toggleAuto()">▶ 자동</button>
</div>
<div id="info">🔄 드래그 회전 | 휠 줌</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const S = new THREE.Scene();
S.background = new THREE.Color(0x87CEEB);
const C = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 1, 10000);
C.position.set(2500, 1500, 2500);
const R = new THREE.WebGLRenderer({ antialias:true });
R.setSize(innerWidth, innerHeight);
R.shadowMap.enabled = true;
document.body.appendChild(R.domElement);
const O = new THREE.OrbitControls(C, R.domElement);
O.target.set(810, 100, 656); O.update();

S.add(new THREE.AmbientLight(0x404060));
const dl = new THREE.DirectionalLight(0xffffff, 1);
dl.position.set(2000,3000,2000); S.add(dl);
S.add(new THREE.DirectionalLight(0xffffff, .4)).position.set(-1000,1000,-2000);

const grid = new THREE.GridHelper(4000,20,0x888888,0x444444);
grid.position.y = -540; S.add(grid);

// ── Materials ──
const colBed = new THREE.MeshPhongMaterial({ color:0xcc3333 });
const colPipe = new THREE.MeshPhongMaterial({ color:0x888888 });
const colRoof = new THREE.MeshPhongMaterial({ color:0xffdd44, transparent:true, opacity:.5 });
const colKitchen = new THREE.MeshPhongMaterial({ color:0x3399ff });
const colTent = new THREE.MeshPhongMaterial({ color:0x66ccff, transparent:true, opacity:.5 });
const colBase = new THREE.MeshPhongMaterial({ color:0x666666 });
const colWheel = new THREE.MeshPhongMaterial({ color:0x444444 });

const M = new THREE.Group(); S.add(M);

function box(w,h,d,mat,pos) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(pos[0],pos[1],pos[2]);
  m.castShadow = true; m.receiveShadow = true;
  M.add(m); return m;
}

// ── Fixed body ──
box(1620,20,1312,colBase,[810,-530,656]);
box(1620,540,20,colBase,[810,-270,0]);
box(20,540,1312,colBase,[0,-270,656]);
box(20,540,1312,colBase,[1620,-270,656]);
box(285,340,500,colWheel,[142,-370,650]);
box(285,340,500,colWheel,[1478,-370,650]);

// ── Tailgate: hinge at BOTTOM rear edge ──
const pivTG = new THREE.Group();
pivTG.position.set(810, -540, 1312);
M.add(pivTG);
const tailgate = new THREE.Mesh(new THREE.BoxGeometry(1620, 540, 20), colBase);
tailgate.position.set(0, 270, 0);
tailgate.castShadow = true; tailgate.receiveShadow = true;
pivTG.add(tailgate);

// ── Pipe Frame (rises by 1/3 = 360) ──
const pipeGroup = new THREE.Group();
M.add(pipeGroup);

function pb(w,h,d,mat,pos) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(pos[0],pos[1],pos[2]);
  m.castShadow = true; m.receiveShadow = true;
  pipeGroup.add(m); return m;
}

pb(40,1080,40,colPipe,[700,0,20]); pb(40,1080,40,colPipe,[920,0,20]);
pb(40,1080,40,colPipe,[700,0,1292]); pb(40,1080,40,colPipe,[920,0,1292]);
pb(220,30,30,colPipe,[810,525,20]); pb(220,30,30,colPipe,[810,525,1292]);
pb(220,30,30,colPipe,[810,-525,20]); pb(220,30,30,colPipe,[810,-525,1292]);

// ── Roof: pivots IN pipeGroup (rise with pipe) ──
const pivL = new THREE.Group(); pivL.position.set(700, 540, 1312); pipeGroup.add(pivL);
const pivR = new THREE.Group(); pivR.position.set(920, 540, 1312); pipeGroup.add(pivR);
const P = { pivL, pivR };

P.roofL = new THREE.Mesh(new THREE.BoxGeometry(700, 20, 1312), colRoof);
P.roofL.position.set(-350, 0, -656); pivL.add(P.roofL);
P.roofR = new THREE.Mesh(new THREE.BoxGeometry(700, 20, 1312), colRoof);
P.roofR.position.set(350, 0, -656); pivR.add(P.roofR);

// Center acrylic roof (in pipeGroup, rises with it)
pb(220, 20, 1312, colRoof, [810, 540, 656]);

// ── Side panels: 바닥(소파 아래)에 보관, 지붕 끝에 힌지 연결 ──
const sideLg = new THREE.Group(); sideLg.position.set(0, -540, 656); M.add(sideLg); P.sideLg = sideLg;
P.sideL = new THREE.Mesh(new THREE.BoxGeometry(20, 1440, 1312), colRoof);
P.sideL.position.set(0, 720, 0); sideLg.add(P.sideL);
const sideRg = new THREE.Group(); sideRg.position.set(1620, -540, 656); M.add(sideRg); P.sideRg = sideRg;
P.sideR = new THREE.Mesh(new THREE.BoxGeometry(20, 1440, 1312), colRoof);
P.sideR.position.set(0, 720, 0); sideRg.add(P.sideR);

// ── Sofas: 2단, 상단만 슬라이딩 (하단 윗면 = 적재함 상부 y=0) ──
P.sofaL = box(700, 100, 1312, colBed, [350, 50, 656]);
P.sofaR = box(700, 100, 1312, colBed, [1270, 50, 656]);

// ── Kitchen: 오른쪽 소파 하부공간 전체, 2/3 슬라이딩 ──
P.kitchen = box(700, 540, 1312, colKitchen, [1270, -270, 656]);
P.kitchen.visible = false;

// ── Tent ──
P.tent = box(700, 300, 1, colTent, [350, -200, 1312]);
P.tent.visible = false;

// ── Mode ──
let mode = 0, t = 0, autoPlay = false;

function setMode(m) {
  mode = m; t = m; updateModel();
}

function toggleAuto() {
  autoPlay = !autoPlay;
  document.querySelector('.btn3').textContent = autoPlay ? '■ 정지' : '▶ 자동';
  if (autoPlay) t = 0;
}

function updateModel() {
  const p = Math.min(1, Math.max(0, t));

  // ── 1. Sofas → 바깥쪽 슬라이딩 ──
  const sofaT = Math.min(1, Math.max(0, p / 0.4));
  P.sofaL.position.x = 350 - sofaT * 170;
  P.sofaR.position.x = 1270 + sofaT * 170;

  // ── 2. Tailgate → 아래 힌지 ──
  const tgT = Math.min(1, Math.max(0, (p - 0.1) / 0.3));
  pivTG.rotation.x = tgT * Math.PI/2;

  // ── 3. Pipe frame → 1/3 상승 (1080 × 1/3 = 360) ──
  const pipeT = Math.min(1, Math.max(0, (p - 0.3) / 0.4));
  const pipeRise = pipeT * 360;
  pipeGroup.position.y = pipeRise;

  // ── 4. Roof panels unfold (from raised position) ──
  const rpp = Math.min(1, Math.max(0, (p - 0.5) / 0.4));
  P.pivL.rotation.z = (Math.PI/2) * (1 - rpp);
  P.pivR.rotation.z = (Math.PI/2) * (rpp - 1);

  // ── 4b. Side panels: 바닥→벽 힌지 상승 (소파 아래→지붕 끝 연결) ──
  const sp = Math.min(1, Math.max(0, (p - 0.4) / 0.5));
  P.sideLg.rotation.z = (-Math.PI/2) * (1 - sp);
  P.sideRg.rotation.z = (Math.PI/2) * (1 - sp);

  // ── 5. Kitchen → 우측공간 전체, 2/3 슬라이딩 ──
  const kt = Math.min(1, Math.max(0, (p - 0.55) / 0.35));
  P.kitchen.visible = kt > 0;
  P.kitchen.position.z = 656 + kt * 875;

  // ── 6. Tent ──
  const tt = Math.min(1, Math.max(0, (p - 0.8) / 0.2));
  P.tent.visible = tt > 0;
  P.tent.position.z = 1312 + tt * 600;
  P.tent.scale.z = tt;
  P.tent.scale.y = tt;
}

function loop() {
  requestAnimationFrame(loop);
  if (autoPlay) { t += 0.004; if (t > 1) t = 0; updateModel(); }
  O.update(); R.render(S, C);
}
loop();

window.addEventListener('resize', () => {
  C.aspect = innerWidth/innerHeight; C.updateProjectionMatrix();
  R.setSize(innerWidth, innerHeight);
});

updateModel();
</script>
</body>
</html>
